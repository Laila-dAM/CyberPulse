<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | CyberPulse</title>

    <link
        rel="icon"
        href="../assets/logo/favicon.ico"
    >

    <link
        rel="stylesheet"
        href="../css/variables.css"
    >

    <link
        rel="stylesheet"
        href="../css/reset.css"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/forms.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >
</head>
<body>
    <main class="login-page">
        <section class="login-hero">
            <div class="login-overlay"></div>

            <img
                src="../assets/images/login-background.jpg"
                alt="CyberPulse Background"
                class="login-background"
            >

            <div class="login-hero-content">
                <img
                    src="../assets/logo/cyberpulse-logo.png"
                    alt="CyberPulse Logo"
                    class="login-logo"
                >

                <h1 class="login-hero-title">
                    CyberPulse
                </h1>

                <p class="login-hero-description">
                    Real-Time Infrastructure Monitoring, Analytics and Cyber Intelligence Platform
                </p>
            </div>
        </section>

        <section class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <h2 class="login-title">
                        Welcome Back
                    </h2>

                    <p class="login-subtitle">
                        Sign in to access your monitoring dashboard
                    </p>
                </div>

                <form
                    id="login-form"
                    class="login-form"
                >
                    <div class="form-group">
                        <label
                            for="email"
                            class="form-label"
                        >
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-input"
                            placeholder="Enter your email address"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label
                            for="password"
                            class="form-label"
                        >
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-input"
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <div class="form-options">
                        <label class="checkbox-group">
                            <input
                                type="checkbox"
                                id="remember-me"
                                name="remember-me"
                            >

                            <span>
                                Remember Me
                            </span>
                        </label>

                        <a
                            href="#"
                            class="forgot-password-link"
                        >
                            Forgot Password?
                        </a>
                    </div>

                    <button
                        type="submit"
                        class="login-button"
                    >
                        Sign In
                    </button>
                </form>

                <div class="login-divider">
                    <span>
                        OR
                    </span>
                </div>

                <div class="social-login">
                    <button
                        type="button"
                        class="social-button"
                    >
                        Continue with Google
                    </button>

                    <button
                        type="button"
                        class="social-button"
                    >
                        Continue with GitHub
                    </button>
                </div>

                <div class="login-footer">
                    <p>
                        Need access to CyberPulse?
                    </p>

                    <a
                        href="about.html"
                        class="login-footer-link"
                    >
                        Learn More
                    </a>
                </div>
            </div>
        </section>
    </main>

    <script src="../js/utils.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/login.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
