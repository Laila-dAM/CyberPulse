<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Settings | CyberPulse</title>

    <link
        rel="icon"
        href="../assets/logo/favicon.ico"
    >

    <link
        rel="stylesheet"
        href="../css/variables.css"
    >

    <link
        rel="stylesheet"
        href="../css/reset.css"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/layout.css"
    >

    <link
        rel="stylesheet"
        href="../css/sidebar.css"
    >

    <link
        rel="stylesheet"
        href="../css/cards.css"
    >

    <link
        rel="stylesheet"
        href="../css/forms.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img
                    src="../assets/logo/cyberpulse-logo.png"
                    alt="CyberPulse Logo"
                    class="sidebar-logo"
                >

                <h2 class="sidebar-title">
                    CyberPulse
                </h2>
            </div>

            <nav class="sidebar-navigation">
                <ul class="sidebar-menu">
                    <li>
                        <a href="dashboard.html">
                            Dashboard
                        </a>
                    </li>

                    <li>
                        <a href="metrics.html">
                            Metrics
                        </a>
                    </li>

                    <li>
                        <a href="alerts.html">
                            Alerts
                        </a>
                    </li>

                    <li>
                        <a
                            href="settings.html"
                            class="active"
                        >
                            Settings
                        </a>
                    </li>

                    <li>
                        <a href="about.html">
                            About
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="page-header">
                <div>
                    <h1 class="page-title">
                        Settings
                    </h1>

                    <p class="page-subtitle">
                        Configure your CyberPulse environment
                    </p>
                </div>

                <div class="page-actions">
                    <button
                        type="button"
                        class="btn btn-primary"
                    >
                        Save All Changes
                    </button>
                </div>
            </header>

            <section class="settings-section">
                <div class="settings-card">
                    <h2 class="settings-card-title">
                        Account Settings
                    </h2>

                    <form
                        id="account-settings-form"
                        class="settings-form"
                    >
                        <div class="form-group">
                            <label
                                for="full-name"
                                class="form-label"
                            >
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="full-name"
                                class="form-input"
                                value="System Administrator"
                            >
                        </div>

                        <div class="form-group">
                            <label
                                for="email"
                                class="form-label"
                            >
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-input"
                                value="admin@cyberpulse.com"
                            >
                        </div>

                        <div class="form-group">
                            <label
                                for="job-title"
                                class="form-label"
                            >
                                Job Title
                            </label>

                            <input
                                type="text"
                                id="job-title"
                                class="form-input"
                                value="Infrastructure Manager"
                            >
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Update Account
                        </button>
                    </form>
                </div>

                <div class="settings-card">
                    <h2 class="settings-card-title">
                        Security Settings
                    </h2>

                    <form
                        id="security-settings-form"
                        class="settings-form"
                    >
                        <div class="form-group">
                            <label
                                for="current-password"
                                class="form-label"
                            >
                                Current Password
                            </label>

                            <input
                                type="password"
                                id="current-password"
                                class="form-input"
                            >
                        </div>

                        <div class="form-group">
                            <label
                                for="new-password"
                                class="form-label"
                            >
                                New Password
                            </label>

                            <input
                                type="password"
                                id="new-password"
                                class="form-input"
                            >
                        </div>

                        <div class="form-group">
                            <label
                                for="confirm-password"
                                class="form-label"
                            >
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                id="confirm-password"
                                class="form-input"
                            >
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Change Password
                        </button>
                    </form>
                </div>

                <div class="settings-card">
                    <h2 class="settings-card-title">
                        Notification Preferences
                    </h2>

                    <div class="settings-options">
                        <label class="settings-option">
                            <input
                                type="checkbox"
                                checked
                            >

                            <span>
                                Email Notifications
                            </span>
                        </label>

                        <label class="settings-option">
                            <input
                                type="checkbox"
                                checked
                            >

                            <span>
                                Critical Alert Notifications
                            </span>
                        </label>

                        <label class="settings-option">
                            <input
                                type="checkbox"
                                checked
                            >

                            <span>
                                Weekly Reports
                            </span>
                        </label>

                        <label class="settings-option">
                            <input
                                type="checkbox"
                            >

                            <span>
                                SMS Notifications
                            </span>
                        </label>

                        <label class="settings-option">
                            <input
                                type="checkbox"
                                checked
                            >

                            <span>
                                System Health Updates
                            </span>
                        </label>
                    </div>
                </div>

                <div class="settings-card">
                    <h2 class="settings-card-title">
                        Monitoring Thresholds
                    </h2>

                    <form
                        id="monitoring-settings-form"
                        class="settings-form"
                    >
                        <div class="form-group">
                            <label
                                for="cpu-threshold"
                                class="form-label"
                            >
                                CPU Alert Threshold
                            </label>

                            <input
                                type="number"
                                id="cpu-threshold"
                                class="form-input"
                                value="80"
                            >
                        </div>

                        <div class="form-group">
                            <label
                                for="memory-threshold"
                                class="form-label"
                            >
                                Memory Alert Threshold
                            </label>

                            <input
                                type="number"
                                id="memory-threshold"
                                class="form-input"
                                value="85"
                            >
                        </div>

                        <div class="form-group">
                            <label
                                for="disk-threshold"
                                class="form-label"
                            >
                                Disk Alert Threshold
                            </label>

                            <input
                                type="number"
                                id="disk-threshold"
                                class="form-input"
                                value="90"
                            >
                        </div>

                        <div class="form-group">
                            <label
                                for="network-threshold"
                                class="form-label"
                            >
                                Network Alert Threshold
                            </label>

                            <input
                                type="number"
                                id="network-threshold"
                                class="form-input"
                                value="75"
                            >
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Thresholds
                        </button>
                    </form>
                </div>

                <div class="settings-card">
                    <h2 class="settings-card-title">
                        Appearance
                    </h2>

                    <div class="settings-options">
                        <label class="settings-option">
                            <input
                                type="radio"
                                name="theme"
                                checked
                            >

                            <span>
                                Dark Theme
                            </span>
                        </label>

                        <label class="settings-option">
                            <input
                                type="radio"
                                name="theme"
                            >

                            <span>
                                Light Theme
                            </span>
                        </label>

                        <label class="settings-option">
                            <input
                                type="radio"
                                name="theme"
                            >

                            <span>
                                System Theme
                            </span>
                        </label>
                    </div>
                </div>

                <div class="settings-card">
                    <h2 class="settings-card-title">
                        Data Retention
                    </h2>

                    <form
                        id="retention-settings-form"
                        class="settings-form"
                    >
                        <div class="form-group">
                            <label
                                for="retention-period"
                                class="form-label"
                            >
                                Metrics Retention Period
                            </label>

                            <select
                                id="retention-period"
                                class="form-input"
                            >
                                <option>
                                    30 Days
                                </option>

                                <option selected>
                                    90 Days
                                </option>

                                <option>
                                    180 Days
                                </option>

                                <option>
                                    365 Days
                                </option>
                            </select>
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Retention Policy
                        </button>
                    </form>
                </div>
            </section>

            <footer class="page-footer">
                <p>
                    © 2026 CyberPulse. All Rights Reserved.
                </p>
            </footer>
        </main>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/settings.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
