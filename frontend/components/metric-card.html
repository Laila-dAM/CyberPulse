<div class="metric-card">
    <div class="metric-card-header">
        <div class="metric-card-icon">
            <img
                src="assets/icons/cpu.svg"
                alt="CPU Usage"
            >
        </div>

        <div class="metric-card-trend positive">
            +4.8%
        </div>
    </div>

    <div class="metric-card-body">
        <h3 class="metric-card-title">
            CPU Usage
        </h3>

        <div class="metric-card-value">
            42%
        </div>

        <p class="metric-card-description">
            Current processor utilization
        </p>
    </div>

    <div class="metric-card-footer">
        <div class="metric-card-progress">
            <div
                class="metric-card-progress-bar"
                style="width: 42%;"
            ></div>
        </div>

        <span class="metric-card-status">
            Normal
        </span>
    </div>
</div>

<template id="metric-card-template">
    <div class="metric-card">
        <div class="metric-card-header">
            <div class="metric-card-icon">
                <img
                    class="metric-icon"
                    src=""
                    alt="Metric Icon"
                >
            </div>

            <div class="metric-card-trend">
                <span class="metric-trend-value"></span>
            </div>
        </div>

        <div class="metric-card-body">
            <h3 class="metric-card-title"></h3>

            <div class="metric-card-value"></div>

            <p class="metric-card-description"></p>
        </div>

        <div class="metric-card-footer">
            <div class="metric-card-progress">
                <div class="metric-card-progress-bar"></div>
            </div>

            <span class="metric-card-status"></span>
        </div>
    </div>
</template>

<template id="metric-grid-template">
    <div class="metrics-grid">
        <div class="metric-card"></div>
        <div class="metric-card"></div>
        <div class="metric-card"></div>
        <div class="metric-card"></div>
    </div>
</template>
