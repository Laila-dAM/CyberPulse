<header class="navbar">
    <div class="navbar-left">
        <button
            type="button"
            class="navbar-menu-button"
            id="sidebar-toggle"
            aria-label="Toggle Sidebar"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="navbar-brand">
            <img
                src="assets/logo/cyberpulse-logo.png"
                alt="CyberPulse Logo"
                class="navbar-logo"
            >

            <div class="navbar-brand-content">
                <h1 class="navbar-title">
                    CyberPulse
                </h1>

                <span class="navbar-subtitle">
                    Infrastructure Monitoring Platform
                </span>
            </div>
        </div>
    </div>

    <div class="navbar-center">
        <form
            class="navbar-search"
            role="search"
        >
            <input
                type="search"
                class="navbar-search-input"
                placeholder="Search metrics, alerts, processes..."
                aria-label="Search"
            >

            <button
                type="submit"
                class="navbar-search-button"
                aria-label="Submit Search"
            >
                Search
            </button>
        </form>
    </div>

    <div class="navbar-right">
        <div class="navbar-status">
            <span class="navbar-status-indicator"></span>

            <span class="navbar-status-text">
                System Online
            </span>
        </div>

        <button
            type="button"
            class="navbar-action-button"
            aria-label="Refresh Data"
        >
            Refresh
        </button>

        <button
            type="button"
            class="navbar-notification-button"
            aria-label="Notifications"
        >
            <img
                src="assets/icons/alert.svg"
                alt="Notifications"
                class="navbar-icon"
            >

            <span class="navbar-notification-badge">
                3
            </span>
        </button>

        <div class="navbar-user">
            <img
                src="assets/icons/user.svg"
                alt="User Avatar"
                class="navbar-user-avatar"
            >

            <div class="navbar-user-info">
                <span class="navbar-user-name">
                    Administrator
                </span>

                <span class="navbar-user-role">
                    System Manager
                </span>
            </div>
        </div>
    </div>
</header>
