<div class="alert-card critical">

    <div class="alert-card-header">

        <div class="alert-card-info">

            <h3 class="alert-card-title">
                High CPU Usage Detected
            </h3>

            <p class="alert-card-category">
                Infrastructure Monitoring
            </p>

        </div>

        <span class="alert-severity critical">
            Critical
        </span>

    </div>

    <div class="alert-card-body">

        <p class="alert-card-description">
            CPU utilization exceeded the configured threshold and reached 94%.
        </p>

        <div class="alert-card-details">

            <div class="alert-detail">
                <span class="alert-detail-label">
                    Server
                </span>

                <span class="alert-detail-value">
                    Production-01
                </span>
            </div>

            <div class="alert-detail">
                <span class="alert-detail-label">
                    Status
                </span>

                <span class="alert-detail-value">
                    Active
                </span>
            </div>

            <div class="alert-detail">
                <span class="alert-detail-label">
                    Time
                </span>

                <span class="alert-detail-value">
                    2 Minutes Ago
                </span>
            </div>

        </div>

    </div>

    <div class="alert-card-footer">

        <button
            type="button"
            class="alert-action-button secondary-action"
        >
            Ignore
        </button>

        <button
            type="button"
            class="alert-action-button primary-action"
        >
            Resolve
        </button>

    </div>

</div>

<template id="alert-card-template">

    <article class="alert-card">

        <div class="alert-card-header">

            <div class="alert-card-info">

                <h3 class="alert-card-title"></h3>

                <p class="alert-card-category"></p>

            </div>

            <span class="alert-severity"></span>

        </div>

        <div class="alert-card-body">

            <p class="alert-card-description"></p>

            <div class="alert-card-details">

                <div class="alert-detail">
                    <span class="alert-detail-label">
                        Server
                    </span>

                    <span class="alert-detail-value alert-server"></span>
                </div>

                <div class="alert-detail">
                    <span class="alert-detail-label">
                        Status
                    </span>

                    <span class="alert-detail-value alert-status"></span>
                </div>

                <div class="alert-detail">
                    <span class="alert-detail-label">
                        Time
                    </span>

                    <span class="alert-detail-value alert-time"></span>
                </div>

            </div>

        </div>

        <div class="alert-card-footer">

            <button
                type="button"
                class="alert-action-button secondary-action ignore-alert"
            >
                Ignore
            </button>

            <button
                type="button"
                class="alert-action-button primary-action resolve-alert"
            >
                Resolve
            </button>

        </div>

    </article>

</template>
