<div class="alert-card critical">
    <div class="alert-card-header">
        <div class="alert-card-icon">
            <img
                src="assets/icons/alert.svg"
                alt="Critical Alert"
            >
        </div>

        <div class="alert-card-info">
            <h3 class="alert-card-title">
                High CPU Usage
            </h3>

            <span class="alert-card-severity">
                Critical
            </span>
        </div>

        <div class="alert-card-status">
            Active
        </div>
    </div>

    <div class="alert-card-body">
        <p class="alert-card-message">
            CPU utilization exceeded the configured threshold and reached 92%.
        </p>

        <div class="alert-card-metrics">
            <div class="alert-metric">
                <span class="alert-metric-label">
                    Current Value
                </span>

                <span class="alert-metric-value">
                    92%
                </span>
            </div>

            <div class="alert-metric">
                <span class="alert-metric-label">
                    Threshold
                </span>

                <span class="alert-metric-value">
                    80%
                </span>
            </div>
        </div>
    </div>

    <div class="alert-card-footer">
        <span class="alert-card-time">
            2 minutes ago
        </span>

        <div class="alert-card-actions">
            <button
                type="button"
                class="btn btn-secondary"
            >
                Ignore
            </button>

            <button
                type="button"
                class="btn btn-primary"
            >
                Resolve
            </button>
        </div>
    </div>
</div>

<template id="alert-card-template">
    <div class="alert-card">
        <div class="alert-card-header">
            <div class="alert-card-icon">
                <img
                    src="assets/icons/alert.svg"
                    alt="Alert"
                >
            </div>

            <div class="alert-card-info">
                <h3 class="alert-card-title"></h3>

                <span class="alert-card-severity"></span>
            </div>

            <div class="alert-card-status"></div>
        </div>

        <div class="alert-card-body">
            <p class="alert-card-message"></p>

            <div class="alert-card-metrics">
                <div class="alert-metric">
                    <span class="alert-metric-label">
                        Current Value
                    </span>

                    <span class="alert-metric-value current-value"></span>
                </div>

                <div class="alert-metric">
                    <span class="alert-metric-label">
                        Threshold
                    </span>

                    <span class="alert-metric-value threshold-value"></span>
                </div>
            </div>
        </div>

        <div class="alert-card-footer">
            <span class="alert-card-time"></span>

            <div class="alert-card-actions">
                <button
                    type="button"
                    class="btn btn-secondary dismiss-alert"
                >
                    Dismiss
                </button>

                <button
                    type="button"
                    class="btn btn-primary resolve-alert"
                >
                    Resolve
                </button>
            </div>
        </div>
    </div>
</template>
